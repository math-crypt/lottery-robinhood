[profile.default]
remappings = [
    "bls-solidity/=lib/openvrf/lib/bls-solidity/src/",
    "openzeppelin-contracts/=lib/openvrf/lib/openzeppelin-contracts/contracts/",
    "openvrf/=lib/openvrf/src/",
]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]
libs = ["lib"]
out = "out"
solc_version = "0.8.26"
src = "src"
via_ir = true
optimizer = true
optimizer_runs = 1
gas_limit = 9223372036854775807

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false
