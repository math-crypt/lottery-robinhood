<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="abyssBg" cx="50%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#071A15"/>
      <stop offset="60%" stop-color="#05110E"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C2A5"/>
      <stop offset="55%" stop-color="#C99B78"/>
      <stop offset="100%" stop-color="#B38662"/>
    </linearGradient>
    <linearGradient id="antiqueBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#abyssBg)"/>
  <!-- Minimalist Double Hairline Signet Ring -->
  <circle cx="200" cy="200" r="142" fill="none" stroke="url(#roseGold)" stroke-width="2.2"/>
  <circle cx="200" cy="200" r="131" fill="none" stroke="url(#antiqueBronze)" stroke-width="1.6" stroke-opacity="0.88"/>
  <!-- Minimalist Hairline Filigree Bow & Arrow Monogram (-45 deg) -->
  <g transform="translate(200,200) rotate(-45)">
    <!-- Taut Hairline Bowstring -->
    <line x1="-26" y1="-82" x2="-26" y2="82" stroke="url(#antiqueBronze)" stroke-width="1.6" stroke-opacity="0.85"/>
    <!-- Double Hairline Parabolic Bow Arc -->
    <path d="M -26,-82 Q 58,0 -26,82" fill="none" stroke="url(#roseGold)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -26,-82 Q 44,0 -26,82" fill="none" stroke="url(#antiqueBronze)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <!-- Needle-Thin Piercing Arrow -->
    <line x1="-80" y1="0" x2="86" y2="0" stroke="url(#roseGold)" stroke-width="2.0" stroke-linecap="round"/>
    <polyline points="60,-15 86,0 60,15" fill="none" stroke="url(#roseGold)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>